<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Christmas Letter</title>
<style>
:root{color-scheme:dark;--mah:#2a140c;--mah2:#4a2415;--amber:#ffb347;--gold:#f3c96b;--snow:#8fb4e3;--ink:#2b1306;--paper:#f2e2b8;--wine:#7a1f2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#1a0d08;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* =========================================================
   SCENE 1: THE COZY WINTER VILLAGE
   ========================================================= */
#village{position:fixed;inset:0;background:linear-gradient(#0a122e,#1a2a55 60%,#2a4a82);z-index:10;transition:opacity 1.2s ease, transform 1.2s ease;overflow:hidden}
#village.hidden{opacity:0;pointer-events:none;transform:scale(1.1)}

/* Moon & Sky */
.v-moon{position:absolute;right:15%;top:10%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e6ddb8);box-shadow:0 0 30px 10px rgba(220,230,255,.2)}
/* Snow Hills */
.v-hill{position:absolute;left:-10%;right:-10%;bottom:0;height:50%;background:#e8f0ff;border-radius:50% 50% 0 0;box-shadow:inset 0 10px 20px rgba(140,160,200,.5)}
.v-hill.back{background:#a9bfe6;bottom:15%;height:40%;border-radius:40% 60% 0 0;left:-30%;right:30%}

/* Houses */
.house{position:absolute;bottom:20%;background:#2a140c;border-radius:4px;box-shadow:0 10px 20px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center}
.house::before{content:"";position:absolute;top:-30px;left:-10px;right:-10px;height:40px;background:#5a2e19;clip-path:polygon(50% 0,100% 100%,0 100%)}
.house .w{width:14px;height:14px;background:#ffb347;box-shadow:0 0 15px 3px #ffb347;border-radius:2px;margin:2px}
.house .w.off{background:#1a1a1a;box-shadow:none}
.h1{left:10%;width:80px;height:70px}
.h2{left:25%;width:60px;height:50px;bottom:25%}
.h3{right:15%;width:90px;height:80px}

/* Main Clickable House */
.main-house{position:absolute;left:45%;bottom:15%;width:110px;height:100px;background:#4a2415;border-radius:4px;box-shadow:0 15px 25px rgba(0,0,0,.6),0 0 30px rgba(255,180,80,.3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .3s}
.main-house:hover{transform:scale(1.05)}
.main-house::before{content:"";position:absolute;top:-40px;left:-15px;right:-15px;height:50px;background:#6a3720;clip-path:polygon(50% 0,100% 100%,0 100%)}
.main-house .w{width:24px;height:24px;background:#ffb347;box-shadow:0 0 20px 5px #ffb347;border-radius:3px;margin-bottom:10px}
.main-house .door{width:30px;height:45px;background:#7a1f2b;border-radius:4px 4px 0 0;position:absolute;bottom:0;box-shadow:inset 0 0 10px rgba(255,180,80,.5);display:grid;place-items:center;color:#f3c96b;font-size:10px}
.main-house .pulse-btn{position:absolute;top:-70px;background:rgba(243,201,107,.9);color:#2a140c;padding:5px 10px;border-radius:15px;font-size:12px;font-weight:bold;white-space:nowrap;animation:pulse 2s infinite}

/* Bonfire */
.bonfire{position:absolute;left:15%;bottom:10%;width:40px;height:50px}
.bonfire .log{position:absolute;bottom:0;width:100%;height:10px;background:#2a140c;border-radius:5px;transform:rotate(10deg)}
.bonfire .flame{position:absolute;bottom:8px;left:5px;width:30px;height:40px;background:radial-gradient(ellipse at 50% 80%,#fff4b8,#ffbd3d 40%,#ee5a1a 75%,transparent);border-radius:50% 50% 50% 50%/72% 72% 28% 28%;animation:fl 0.8s ease-in-out infinite alternate;transform-origin:50% 100%;filter:blur(1px)}

/* Snowmen */
.snowman{position:absolute;bottom:25%;width:30px;height:50px}
.snowman .b1,.snowman .b2{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border-radius:50%;box-shadow:inset -5px -5px 10px rgba(140,160,200,.5)}
.snowman .b1{bottom:0;width:30px;height:30px}
.snowman .b2{bottom:25px;width:20px;height:20px}
.snowman .n{position:absolute;bottom:32px;left:50%;width:10px;height:3px;background:orange;transform:translateX(-20%) rotate(15deg);border-radius:2px}
.sm1{left:70%}.sm2{left:75%}.sm3{left:80%}

/* Train */
.train{position:absolute;bottom:5%;left:-100px;width:80px;height:30px;background:#4a2415;border-radius:5px;animation:trainMove 15s linear infinite;box-shadow:0 0 20px rgba(255,180,80,.4)}
.train::before{content:"";position:absolute;top:-15px;left:10px;width:20px;height:15px;background:#5a2e19;border-radius:3px 3px 0 0}
.train .tw{position:absolute;top:5px;left:10px;right:10px;bottom:5px;background:#ffb347;box-shadow:0 0 10px #ffb347;border-radius:2px}
@keyframes trainMove{0%{transform:translateX(0)}100%{transform:translateX(120vw)}}

/* Village Snow */
.v-snow{position:absolute;top:-10px;width:4px;height:4px;background:#fff;border-radius:50%;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh)}}

/* =========================================================
   SCENE 2: THE WARM ROOM (Original)
   ========================================================= */
#scene{position:fixed;inset:0;overflow:hidden;background:
 repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 46px),
 linear-gradient(#2e170d,#3d1d10 70%,#26120a);z-index:20;transition:opacity 1.2s ease;opacity:0;pointer-events:none}
#scene.active{opacity:1;pointer-events:auto}

.abs{position:absolute}
.moonlight{position:absolute;left:50%;top:2%;width:130%;height:52%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 35%,rgba(110,150,220,.34),transparent 68%)}
.firelight{position:absolute;left:-30%;bottom:6%;width:110%;height:75%;background:radial-gradient(ellipse at 50% 60%,rgba(255,150,50,.5),rgba(255,110,30,.16) 45%,transparent 70%);animation:glow 3.3s ease-in-out infinite;pointer-events:none;z-index:6;mix-blend-mode:screen}
@keyframes glow{0%,100%{opacity:.8}18%{opacity:1}34%{opacity:.7}51%{opacity:.95}70%{opacity:.75}86%{opacity:1}}

.win{position:absolute;left:50%;top:calc(4% + env(safe-area-inset-top,0px));width:74%;max-width:360px;height:30%;transform:translateX(-50%);border:.7em solid #5a2e19;border-radius:.4em .4em .2em .2em;box-shadow:0 0 40px rgba(120,160,230,.35),inset 0 0 20px rgba(0,0,0,.6);overflow:hidden;background:linear-gradient(#08122b,#14295a 70%,#2a4a82);font-size:clamp(10px,2.8vw,14px)}
.moon{position:absolute;right:14%;top:14%;width:2.6em;height:2.6em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e6ddb8);box-shadow:0 0 1.6em .6em rgba(220,230,255,.35)}
.hill{position:absolute;left:-10%;right:-10%;bottom:-2.4em;height:5em;border-radius:50%;background:linear-gradient(#e8f0ff,#a9bfe6)}
.flake{position:absolute;top:-8px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
.mull{position:absolute;inset:0;background:linear-gradient(#5a2e19,#5a2e19) 50% 0/.6em 100% no-repeat,linear-gradient(#5a2e19,#5a2e19) 0 50%/100% .6em no-repeat}
.sill{position:absolute;left:50%;top:calc(4% + 30% + .2em);width:min(82%,400px);height:.9em;transform:translateX(-50%);background:linear-gradient(#e8f0ff,#8fa8d4);border-radius:.5em .5em 0 0;box-shadow:0 .5em 0 #4a2415;margin-top:.5em}

.fp{position:absolute;left:3%;bottom:30%;width:min(36vw,180px);aspect-ratio:1/1.05;z-index:3;font-size:clamp(9px,2.6vw,13px)}
.mantel{position:absolute;left:-8%;right:-8%;top:0;height:11%;background:linear-gradient(#7a4226,#4a2415);border-radius:.3em;box-shadow:0 .5em 1em rgba(0,0,0,.5)}
.surround{position:absolute;left:0;right:0;top:11%;bottom:0;background:linear-gradient(90deg,#3a1b0f,#552a18 50%,#3a1b0f)}
.box{position:absolute;left:16%;right:16%;top:24%;bottom:0;border-radius:45% 45% 0 0/30% 30% 0 0;background:radial-gradient(ellipse at 50% 100%,#6b1d05,#160703 75%);overflow:hidden;box-shadow:inset 0 0 1.2em #000}
.fl{position:absolute;bottom:14%;width:34%;height:62%;border-radius:50% 50% 50% 50%/72% 72% 28% 28%;background:radial-gradient(ellipse at 50% 80%,#fff4b8,#ffbd3d 40%,#ee5a1a 75%,transparent);transform-origin:50% 100%;animation:fl 1s ease-in-out infinite alternate;filter:blur(.5px)}
.fl:nth-child(1){left:10%;height:50%;animation-duration:.8s}
.fl:nth-child(2){left:33%;animation-duration:1.1s;height:78%}
.fl:nth-child(3){left:56%;height:56%;animation-duration:.9s;animation-delay:-.4s}
@keyframes fl{from{transform:scale(.9,.85) skewX(-4deg)}to{transform:scale(1.05,1.12) skewX(5deg)}}
.log{position:absolute;bottom:6%;left:12%;right:12%;height:14%;border-radius:1em;background:linear-gradient(#5a3018,#2a1409)}

.tree{position:absolute;right:3%;bottom:29%;width:min(34vw,170px);aspect-ratio:1/1.55;z-index:3}
.tier{position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(90deg,#0c2a1c,#1d4d35 45%,#0c2a1c)}
.t1{left:22%;width:56%;top:6%;height:36%}
.t2{left:12%;width:76%;top:26%;height:38%}
.t3{left:0;width:100%;top:48%;height:44%}
.trunk{position:absolute;left:44%;width:12%;bottom:0;height:9%;background:#3a1b0f}
.star{position:absolute;left:50%;top:0;width:12%;aspect-ratio:1;transform:translateX(-50%);background:#ffe07a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 6px #ffd35a)}
.lt{position:absolute;width:6px;height:6px;border-radius:50%;animation:tw 2.6s ease-in-out infinite;z-index:2}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#2a140b,#1a0b06);box-shadow:0 -2px 12px rgba(0,0,0,.5)}
.table{position:absolute;left:0;right:0;bottom:0;height:19%;z-index:4;background:linear-gradient(#6a3720,#3b1c0f 22%,#2a1209);box-shadow:0 -6px 20px rgba(255,150,60,.15)}
.cake{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:15em;height:15em;font-size:clamp(9px,2.9vw,13.5px);z-index:5}
.halo{position:absolute;left:50%;top:-6em;width:36em;height:30em;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 55%,rgba(255,180,80,.32),transparent 65%);transition:opacity 1.2s;animation:glow 2.4s ease-in-out infinite;pointer-events:none}
.s-out .halo{opacity:.3}
.plate{position:absolute;left:50%;bottom:0;width:17em;height:1.9em;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#f6e9c8,#c9a45c 75%);box-shadow:0 .5em 1em rgba(0,0,0,.6)}
.ly{position:absolute;left:50%;transform:translateX(-50%);border-radius:.6em;background:linear-gradient(90deg,#33170b,#5e2e19 40%,#35180c);box-shadow:0 .3em .6em rgba(0,0,0,.4)}
.ly::before{content:"";position:absolute;left:0;right:0;top:48%;height:.7em;background:#f6e6c8;opacity:.9}
.l1{bottom:.9em;width:14em;height:5em}
.l2{bottom:5.6em;width:11em;height:4.2em}
.fr{position:absolute;left:-.3em;right:-.3em;top:-.9em;height:1.9em;border-radius:1em;background:linear-gradient(#fffaf0,#f7e8cf);box-shadow:0 .15em .3em rgba(0,0,0,.25)}
.fr::after{content:"";position:absolute;left:.5em;right:.5em;top:1.3em;height:1.5em;background:radial-gradient(ellipse .55em .9em at 50% 0,#f9ecd6 96%,transparent) 0 0/1.9em 100% repeat-x,radial-gradient(ellipse .5em .5em at 50% 0,#f9ecd6 96%,transparent) .9em 0/2.9em 100% repeat-x}
.berry{position:absolute;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#c0182b 55%,#7a0a18);bottom:9.5em;box-shadow:0 .1em .2em rgba(0,0,0,.4)}
.leaf{position:absolute;bottom:9.6em;width:1.8em;height:.9em;background:linear-gradient(135deg,#2f7a45,#144a28);border-radius:0 100% 0 100%}
.candle{position:absolute;left:50%;bottom:9.6em;width:1em;height:3.6em;margin-left:-.5em;border-radius:.2em;background:repeating-linear-gradient(135deg,#f7efe0 0 .45em,#c8283a .45em .9em)}
.flame{position:absolute;left:50%;bottom:13em;width:.95em;height:1.8em;margin-left:-.475em;border-radius:50% 50% 50% 50%/68% 68% 32% 32%;background:radial-gradient(ellipse at 50% 75%,#fffbd0,#ffcb52 38%,#ff7d1c 72%,transparent);box-shadow:0 0 1.3em .7em rgba(255,170,60,.45);transform-origin:50% 100%;animation:cf .8s ease-in-out infinite alternate;transition:opacity .7s}
@keyframes cf{from{transform:scale(.92,.9) rotate(-3deg)}to{transform:scale(1.05,1.1) rotate(3deg)}}
.s-out .flame{opacity:0;animation-play-state:paused}
.sm{position:absolute;left:50%;bottom:13.2em;width:.8em;height:.8em;margin-left:-.4em;border-radius:50%;background:radial-gradient(rgba(230,230,240,.55),transparent 70%);opacity:0}
.s-out .sm{animation:puff 2.8s ease-out both}
.s-out .sm:nth-of-type(2){animation-delay:.35s;margin-left:-.1em}
.s-out .sm:nth-of-type(3){animation-delay:.7s;margin-left:-.7em}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.8}100%{opacity:0;transform:translateY(-5em) translateX(.8em) scale(3.2)}}

.frame{position:absolute;left:calc(50% + 9.4em);bottom:12%;width:6.4em;aspect-ratio:4/5;transform:rotate(3deg);z-index:5;font-size:clamp(9px,2.9vw,13.5px);filter:drop-shadow(0 .5em .6em rgba(0,0,0,.55))}
.frame::before{content:"";position:absolute;left:30%;right:30%;top:20%;bottom:-.5em;background:#3a1b0f;z-index:-1;clip-path:polygon(50% 0,100% 100%,0 100%)}
.fr-wood{position:absolute;inset:0;padding:.45em;border-radius:.25em;background:linear-gradient(135deg,#f3c96b,#a8772a 45%,#e8bd5c 70%,#8a5a1d)}
.fr-mat{width:100%;height:100%;padding:.35em;background:#f6ead0;box-shadow:inset 0 0 .3em rgba(0,0,0,.4)}
.pic{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#2a4a82,#e0a070);display:grid;place-items:center}
.pic::before{content:"♥";font-size:2.4em;color:#ffb3c1;text-shadow:0 0 .4em rgba(255,150,170,.8)}
.pic::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 42%);pointer-events:none}
.frame.l{left:calc(50% - 15.8em);transform:rotate(-3deg)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* ---------- controls ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(3% + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:25;pointer-events:none}
.btn{pointer-events:auto;padding:.85em 1.7em;border-radius:2em;border:1px solid var(--gold);background:linear-gradient(#5a1f2a,#3c121b);color:#ffe9b8;font-size:1.05rem;letter-spacing:.03em;box-shadow:0 0 14px rgba(255,190,90,.45);animation:pulse 2.8s ease-in-out infinite;transition:opacity .6s,transform .6s}
@keyframes pulse{50%{box-shadow:0 0 28px 4px rgba(255,190,90,.7)}}
.s-out .btn.open{opacity:0;transform:translateY(20px);pointer-events:none;animation:none}
.mute{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;width:42px;height:42px;border-radius:50%;border:1px solid rgba(243,201,107,.5);background:rgba(30,12,6,.6);color:#ffe9b8;font-size:1.1rem;backdrop-filter:blur(4px)}

/* Back Button */
.back-btn{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:25;padding:6px 12px;border-radius:20px;background:rgba(30,12,6,.6);border:1px solid var(--gold);color:var(--gold);font-size:14px;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .5s}
#scene.active .back-btn{opacity:1;pointer-events:auto}

/* ---------- envelope ---------- */
.env{position:fixed;left:50%;top:50%;width:min(76vw,300px);aspect-ratio:3/2;transform:translate(-50%,120vh);transition:transform 1.3s cubic-bezier(.2,.8,.2,1),opacity .9s;z-index:30;perspective:900px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
.s-env .env{transform:translate(-50%,-50%)}
.s-open .env{opacity:0;transform:translate(-50%,-10%)}
.eb{position:absolute;inset:0;background:#4f1019;border-radius:.3em}
.ef{position:absolute;inset:0;z-index:2;background:linear-gradient(160deg,#92283a,#6a1824);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.efl{position:absolute;left:0;right:0;top:0;height:58%;z-index:1;background:linear-gradient(#a02f43,#7d1e2e);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform 1s ease-in-out}
.s-flap .efl{transform:rotateX(-180deg)}
.seal{position:absolute;left:50%;top:48%;width:2.6em;height:2.6em;margin:-1.3em 0 0 -1.3em;z-index:4;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7da8a,#b58a2c);color:#6a1824;display:grid;place-items:center;font-size:1.1rem;transition:opacity .5s}
.s-flap .seal{opacity:0}

/* ---------- letter ---------- */
.letter{position:fixed;left:50%;top:50%;width:min(90vw,430px);height:min(78dvh,600px);transform:translate(-50%,-50%) scale(.25);opacity:0;z-index:40;pointer-events:none;border-radius:.4em;display:flex;flex-direction:column;
 background:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(150,95,30,.28),transparent 60%),repeating-linear-gradient(0deg,rgba(120,80,30,.045) 0 2px,transparent 2px 5px),var(--paper);
 box-shadow:0 0 0 1px rgba(110,70,20,.4),inset 0 0 40px rgba(140,90,30,.4),0 20px 50px rgba(0,0,0,.65);
 transition:transform 1.5s cubic-bezier(.22,.8,.2,1),opacity .6s}
.s-open .letter{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.scroll{flex:1;overflow-y:auto;padding:1.6em 1.5em .6em;-webkit-overflow-scrolling:touch}
#txt{margin:0;white-space:pre-wrap;color:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery","Lucida Handwriting",cursive,Georgia,serif;font-size:clamp(1.15rem,5.2vw,1.5rem);line-height:1.85}
#txt.typing::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-.15em;background:var(--ink);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.foot{padding:.8em;display:flex;justify-content:center}
.foot .btn{animation:none;font-size:1rem;box-shadow:none;border-color:#9a6a2a}
.veil{position:fixed;inset:0;background:rgba(10,4,2,.6);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:35}
.s-env .veil{opacity:1}

/* ---------- enter overlay ---------- */
#enter{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 55%,#3d1d10,#12090a 80%);transition:opacity 1.4s;padding:24px}
#enter.gone{opacity:0;pointer-events:none}
#enter h1{margin:0 0 .3em;font-weight:400;font-size:clamp(1.8rem,8vw,2.8rem);color:#ffe3a6;text-shadow:0 0 22px rgba(255,170,60,.6)}
#enter p{margin:0 0 1.6em;color:#d8b98a;font-style:italic}

@media (prefers-reduced-motion:reduce){.flake,.lt,.halo,.v-snow,.train{animation:none}.letter,.env,.efl{transition-duration:.2s}.btn{animation:none}}
</style>
</head>
<body>

<div id="enter">
  <div>
    <h1>Merry Christmas, my love cici</h1>
    <p>Sound on, if you can.</p>
    <button class="btn" id="enterBtn">Click to enter the village</button>
  </div>
</div>

<!-- ========================================== -->
<!-- SCENE 1: VILLAGE                           -->
<!-- ========================================== -->
<div id="village">
  <div class="v-moon"></div>
  <div class="v-hill back"></div>
  
  <!-- Houses -->
  <div class="house h1"><div class="w"></div><div class="w"></div></div>
  <div class="house h2"><div class="w off"></div><div class="w"></div></div>
  <div class="house h3"><div class="w"></div><div class="w off"></div></div>

  <!-- Bonfire -->
  <div class="bonfire">
    <div class="log"></div>
    <div class="flame"></div>
  </div>

  <!-- Snowmen -->
  <div class="snowman sm1"><div class="b1"></div><div class="b2"></div><div class="n"></div></div>
  <div class="snowman sm2"><div class="b1"></div><div class="b2"></div><div class="n"></div></div>
  <div class="snowman sm3"><div class="b1"></div><div class="b2"></div><div class="n"></div></div>

  <!-- Train -->
  <div class="train"><div class="tw"></div></div>

  <!-- Main House -->
  <div class="main-house" id="mainHouse">
    <div class="pulse-btn">Enter House</div>
    <div class="w"></div>
    <div class="door">♥</div>
  </div>

  <div class="v-hill"></div>
</div>

<!-- ========================================== -->
<!-- SCENE 2: WARM ROOM (Original)              -->
<!-- ========================================== -->
<div id="scene">
  <button class="back-btn" id="backBtn">← Back to Village</button>
  
  <div class="moonlight"></div>
  <div class="win" id="win"><div class="moon"></div><div class="hill"></div><div class="mull"></div></div>
  <div class="sill"></div>
  <div class="floor"></div>

  <div class="fp">
    <div class="surround"></div><div class="mantel"></div>
    <div class="box"><div class="fl"></div><div class="fl"></div><div class="fl"></div><div class="log"></div></div>
  </div>

  <div class="tree" id="tree">
    <div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div>
    <div class="trunk"></div><div class="star"></div>
  </div>

  <div class="table"></div>
  <div class="cake" aria-hidden="true">
    <div class="halo"></div>
    <div class="plate"></div>
    <div class="ly l1"><div class="fr"></div></div>
    <div class="ly l2"><div class="fr"></div></div>
    <span class="leaf" style="left:3.2em;transform:rotate(-12deg)"></span>
    <span class="leaf" style="right:3.2em;transform:scaleX(-1) rotate(-12deg)"></span>
    <span class="berry" style="left:4.9em"></span><span class="berry" style="left:5.9em;bottom:9.3em"></span><span class="berry" style="right:4.9em"></span>
    <div class="candle"></div>
    <div class="flame"></div>
    <span class="sm"></span><span class="sm"></span><span class="sm"></span>
  </div>
  <div class="frame l"><div class="fr-wood"><div class="fr-mat"><div class="pic"><img alt="우리가 함께한 사진 1" hidden></div></div></div></div>
  <div class="frame"><div class="fr-wood"><div class="fr-mat"><div class="pic"><img alt="우리가 함께한 사진 2" hidden></div></div></div></div>
  <div class="firelight"></div>

  <div class="dock"><button class="btn open" id="openBtn">Open Letter</button></div>
</div>

<button class="mute" id="mute" aria-label="Mute sound">♪</button>

<div class="veil"></div>
<div class="env" aria-hidden="true">
  <div class="eb"></div><div class="efl"></div><div class="ef"></div><div class="seal">♥</div>
</div>

<div class="letter" role="dialog" aria-label="Your letter">
  <div class="scroll" id="scroll"><p id="txt" lang="zh-CN"></p></div>
  <div class="foot"><button class="btn" id="closeBtn">Close Letter</button></div>
</div>

<script>
/* ================================================================
   ✎ EDIT YOUR LETTER HERE
   ================================================================ */
const LETTER = `亲爱的，

最近过得好吗？今天是圣诞节！希望你多吃点好吃的，和珍贵的人一起创造温暖又幸福的回忆。我看着这个，想象着你微笑的样子，就这样度过今天哈哈。能准备这个惊喜活动真的很庆幸。

真的好想你。一直觉得要是能在一起就好了，这份遗憾总是挥之不去。这么特别的日子没能陪在你身边，真的很抱歉。不过我们的心永远在一起，希望今天这一天你能幸福。

明年我们一定要一起装饰圣诞树，一起去漂亮的咖啡店，一起去好地方逛逛。在那之前，我们互相照顾好身体，再稍微等等吧。一直很感谢你，很爱你。

· 2026.12.25 from. Jin`;

const $ = s => document.querySelector(s);
const body = document.body;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- Village Snow ---------- */
const village = $('#village');
for(let i=0; i<(reduce?10:40); i++){
  const f = document.createElement('div');
  f.className = 'v-snow';
  const s = 2 + Math.random() * 4;
  f.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${(Math.random()*40-20).toFixed(0)}px;animation-duration:${(5+Math.random()*5).toFixed(1)}s;animation-delay:${(-Math.random()*10).toFixed(1)}s;opacity:${(.5+Math.random()*.5).toFixed(2)}`;
  village.appendChild(f);
}

/* ---------- Room Snow (Window) ---------- */
const win = $('#win');
function sizeSnow(){ win.style.setProperty('--h', (win.clientHeight + 14) + 'px'); }
sizeSnow(); addEventListener('resize', sizeSnow);
for (let i = 0; i < (reduce ? 12 : 38); i++){
  const f = document.createElement('i'); f.className = 'flake';
  const s = 2 + Math.random() * 3.5;
  f.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${(Math.random()*30-15).toFixed(0)}px;animation-duration:${(7+Math.random()*7).toFixed(1)}s;animation-delay:${(-Math.random()*14).toFixed(1)}s;opacity:${(.5+Math.random()*.5).toFixed(2)}`;
  win.appendChild(f);
}

/* ---------- Tree Lights ---------- */
const cols = ['#ffd27a','#ff9a5c','#ffe9b0','#ff7f9e','#bcd7ff'];
const tree = $('#tree');
for (let i = 0; i < 26; i++){
  const y = .12 + Math.random() * .78;
  const x = .5 + (Math.random() - .5) * y * .85;
  const d = document.createElement('i'); d.className = 'lt';
  const c = cols[i % cols.length];
  d.style.cssText = `left:${x*100}%;top:${y*88}%;background:${c};box-shadow:0 0 7px 2px ${c};animation-delay:${(-Math.random()*2.6).toFixed(2)}s;animation-duration:${(2+Math.random()*2).toFixed(1)}s`;
  tree.appendChild(d);
}

/* ================================================================
   AUDIO SYSTEM (Village BGM & Room BGM Crossfade)
   ================================================================ */
let ac, master, muted = false;
let villageGain, roomGain;
let timer, nextT_v = 0, nextT_r = 0, step_v = 0, step_r = 0;

const mf = m => 440 * Math.pow(2, (m - 69) / 12);

// Village: Upbeat, higher pitch, C Major
const CH_V = [[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,53]]; // C, Am, F, G
const BAR_V = 2.0;

// Room: Dreamy, slower, F Major
const CH_R = [[41,53,57,60,64],[45,57,60,64,67],[38,50,53,57,60],[43,55,59,62,65]]; // Fmaj7 Am7 Dm7 G7
const BAR_R = 4.2;

function startAudio(){
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .6; master.connect(ac.destination);
    
    // Separate gains for crossfading
    villageGain = ac.createGain(); villageGain.gain.value = 1; villageGain.connect(master);
    roomGain = ac.createGain(); roomGain.gain.value = 0; roomGain.connect(master);

    // Setup room delay
    const busR = ac.createGain(); busR.gain.value = .55; busR.connect(roomGain);
    const dl = ac.createDelay(1); dl.delayTime.value = .42;
    const fb = ac.createGain(); fb.gain.value = .38;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
    busR.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
    window._busR = busR;

    // Fire bed: brown noise
    const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++){ last = (last + .02 * (Math.random()*2-1)) / 1.02; d[i] = last * 3.2; }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
    const g = ac.createGain(); g.gain.value = .5;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    window._noise = buf;

    nextT_v = ac.currentTime + .2; nextT_r = ac.currentTime + .2;
    tick(); timer = setInterval(tick, 500);
  }catch(e){ console.warn('Audio unavailable', e); }
}

function noteV(t, m, dur, vol){
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = 'sine';
  o.frequency.value = mf(m);
  f.type = 'lowpass'; f.frequency.value = 1200;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .05);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(f); f.connect(g); g.connect(villageGain);
  o.start(t); o.stop(t + dur + .1);
}

function noteR(t, m, dur, vol, type){
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = type || 'triangle'; o2.type = 'sine';
  o.frequency.value = mf(m); o2.frequency.value = mf(m); o2.detune.value = 7;
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.6, dur/3));
  g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(window._busR);
  o.start(t); o2.start(t); o.stop(t + dur + .1); o2.stop(t + dur + .1);
}

function pop(t){
  const s = ac.createBufferSource(); s.buffer = window._noise;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200 + Math.random()*2500;
  const g = ac.createGain(); const v = .05 + Math.random()*.18;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .03 + Math.random()*.05);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()*2, .12);
}

function tick(){
  if (!ac) return;
  
  // Village Music Scheduler
  while (nextT_v < ac.currentTime + 2){
    const c = CH_V[step_v % 4];
    // Bass
    noteV(nextT_v, c[0] - 12, BAR_V * .9, .15);
    // Chords
    c.slice(1).forEach((m, i) => noteV(nextT_v + i*.05, m, BAR_V * .8, .05));
    // Random melody
    for (let k = 0; k < 4; k++){
      if(Math.random() < .6) noteV(nextT_v + k*BAR_V/4, c[1 + Math.floor(Math.random()*3)] + 12, .4, .04);
    }
    nextT_v += BAR_V; step_v++;
  }

  // Room Music Scheduler
  while (nextT_r < ac.currentTime + 2){
    const c = CH_R[step_r % 4];
    noteR(nextT_r, c[0], BAR_R * 1.1, .2, 'sine');
    c.slice(1).forEach((m, i) => noteR(nextT_r + i*.07, m, BAR_R * 1.05, .075));
    for (let k = 0; k < 8; k++) if (Math.random() < .42){
      const m = c[1 + Math.floor(Math.random()*4)] + 12 + (Math.random() < .3 ? 12 : 0);
      noteR(nextT_r + k * BAR_R/8, m, 1.6, .07, 'sine');
    }
    nextT_r += BAR_R; step_r++;
  }
  
  // Fireplace pops
  for (let i = 0; i < 5; i++) if (Math.random() < .6) pop(ac.currentTime + Math.random()*.6);
}

$('#mute').onclick = () => {
  if (!ac) return; muted = !muted;
  master.gain.setTargetAtTime(muted ? 0 : .6, ac.currentTime, .1);
  $('#mute').textContent = muted ? '×' : '♪';
  $('#mute').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
};

/* ================================================================
   PHOTO LOADING (Place your photos in assets/ folder)
   ================================================================ */
const PHOTO_SRCS = [
  './assets/photo1.jpeg',
  './assets/photo2.jpeg'
];
document.querySelectorAll('.pic img').forEach((img, i) => {
  img.hidden = false;
  img.src = PHOTO_SRCS[i];
  img.onload = () => console.log('Photo loaded:', img.src);
  img.onerror = () => { console.error('Photo missing:', img.src); img.hidden = true; };
});

/* ================================================================
   SCENE TRANSITIONS & INTERACTIONS
   ================================================================ */
let isInRoom = false;

// Enter Village (Initial state)
$('#enterBtn').onclick = () => { 
  startAudio(); 
  $('#enter').classList.add('gone'); 
};

// Village -> Room (Click House)
$('#mainHouse').onclick = () => {
  if (!isInRoom) {
    isInRoom = true;
    $('#village').classList.add('hidden');
    $('#scene').classList.add('active');
    
    // Crossfade Audio
    if (ac) {
      villageGain.gain.setTargetAtTime(0, ac.currentTime, 1.0);
      roomGain.gain.setTargetAtTime(1, ac.currentTime, 1.0);
    }
  }
};

// Room -> Village (Back Button)
$('#backBtn').onclick = () => {
  if (isInRoom) {
    // If letter is open, close it first
    if (isOpen) closeLetter();
    
    isInRoom = false;
    $('#village').classList.remove('hidden');
    $('#scene').classList.remove('active');
    
    // Crossfade Audio
    if (ac) {
      villageGain.gain.setTargetAtTime(1, ac.currentTime, 1.0);
      roomGain.gain.setTargetAtTime(0, ac.currentTime, 1.0);
    }
  }
};

/* ================================================================
   LETTER SEQUENCE (Original Logic)
   ================================================================ */
let busy = false, isOpen = false, typeT, tm = [];
const t = (ms, fn) => tm.push(setTimeout(fn, ms));
const txt = $('#txt'), sc = $('#scroll');

function typeText(){
  txt.textContent = ''; txt.classList.add('typing');
  let i = 0;
  (function go(){
    if (!isOpen) return;
    i++; txt.textContent = LETTER.slice(0, i); sc.scrollTop = sc.scrollHeight;
    if (i >= LETTER.length){ txt.classList.remove('typing'); return; }
    const ch = LETTER[i-1];
    typeT = setTimeout(go, ',.!?\n，。！？'.includes(ch) ? 260 : 34 + Math.random()*40);
  })();
}
function skipTyping(){
  if (!txt.classList.contains('typing')) return;
  clearTimeout(typeT); txt.textContent = LETTER; txt.classList.remove('typing');
}
txt.addEventListener('click', skipTyping);

function openLetter(){
  if (busy || isOpen) return; busy = true;
  body.classList.add('s-out');
  t(1500, () => body.classList.add('s-env'));
  t(2900, () => body.classList.add('s-flap'));
  t(3900, () => body.classList.add('s-open'));
  t(5300, () => { busy = false; isOpen = true; typeText(); });
}
function closeLetter(){
  if (busy || !isOpen) return; busy = true; isOpen = false;
  clearTimeout(typeT); txt.classList.remove('typing');
  body.classList.remove('s-open');
  t(1500, () => body.classList.remove('s-flap'));
  t(2500, () => body.classList.remove('s-env'));
  t(3600, () => { body.classList.remove('s-out'); txt.textContent = ''; sc.scrollTop = 0; busy = false; });
}
$('#openBtn').onclick = openLetter;
$('#closeBtn').onclick = closeLetter;
</script>
</body>
</html>
